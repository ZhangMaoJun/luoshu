<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>洛书与幻方 · 3D 穿线可视化</title>
<style>
  :root {
    --bg: #070a0e;
    --ink: #e8eef7;
    --dim: #7d8ba0;
    --up: #ff8a3d;
    --down: #38bdf8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  #c { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  #c.grabbing { cursor: grabbing; }

  .hud {
    position: fixed; top: 26px; left: 32px;
    pointer-events: none; user-select: none;
  }
  .hud h1 { font-size: 17px; font-weight: 600; letter-spacing: 0.5px; }
  .hud p { margin-top: 7px; font-size: 12px; color: var(--dim); line-height: 1.75; letter-spacing: 0.2px; }
  .hud .sep { opacity: 0.35; margin: 0 7px; }

  /* ---------- 控制面板 ---------- */
  .panel {
    position: fixed; top: 24px; right: 32px;
    background: rgba(13, 22, 35, 0.66);
    border: 1px solid rgba(120, 160, 210, 0.20);
    border-radius: 14px;
    padding: 13px 15px;
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    display: flex; flex-direction: column; gap: 9px;
    user-select: none;
    box-shadow: 0 12px 34px rgba(0, 0, 0, 0.35);
    max-width: 420px;
  }
  .panel .row { display: flex; align-items: center; gap: 11px; }
  .panel .lab {
    font-size: 11px; color: #6d8099; letter-spacing: 0.4px;
    width: 30px; flex: none; text-align: left;
  }
  .seg {
    display: flex; gap: 3px;
    background: rgba(6, 12, 20, 0.6);
    border-radius: 9px; padding: 3px;
  }
  .seg button {
    appearance: none; border: 0; background: transparent;
    color: #8798ae; font: inherit; font-size: 11.5px;
    padding: 5px 10px; border-radius: 6px; cursor: pointer;
    transition: background .16s, color .16s;
    letter-spacing: 0.3px; white-space: nowrap;
  }
  .seg button:hover { color: #cfdcea; }
  .seg button.on { background: rgba(76, 120, 174, 0.58); color: #f0f6ff; }
  .seg button.on.alt { background: rgba(196, 122, 58, 0.55); color: #ffd9b8; }
  .seg button:disabled { opacity: 0.3; cursor: default; }
  .seg button:disabled:hover { color: #8798ae; }

  .nav {
    display: flex; align-items: center; gap: 2px;
    background: rgba(6, 12, 20, 0.6);
    border-radius: 9px; padding: 3px;
  }
  .nav button {
    appearance: none; border: 0; background: transparent;
    color: #a8b8cc; font: inherit; font-size: 14px; line-height: 1;
    width: 26px; height: 24px; border-radius: 6px; cursor: pointer;
    transition: background .16s, color .16s;
  }
  .nav button:hover { background: rgba(76, 120, 174, 0.45); color: #f0f6ff; }
  .nav button:disabled { opacity: 0.28; cursor: default; }
  .nav button:disabled:hover { background: transparent; color: #a8b8cc; }
  .nav button.wide {
    width: auto; padding: 0 7px;
    font-size: 10.5px; letter-spacing: 0.4px;
  }
  .nav .pos {
    min-width: 58px; text-align: center;
    font-size: 11.5px; color: #c2d0e0; letter-spacing: 0.3px;
    font-variant-numeric: tabular-nums;
  }
  .nav.off { opacity: 0.4; }

  .panel .meta {
    font-size: 10.5px; color: #5e7088; letter-spacing: 0.3px;
    padding-top: 7px; margin-top: 1px;
    border-top: 1px solid rgba(120, 160, 210, 0.13);
    line-height: 1.7;
  }
  .panel .meta b { font-weight: 500; color: #8296ad; }
  .panel .meta .hl { color: #c8a878; }

  .legend {
    position: fixed; left: 32px; bottom: 32px;
    display: flex; flex-direction: column; gap: 9px;
    font-size: 12px; color: var(--dim);
    pointer-events: none; user-select: none;
  }
  .legend span { display: flex; align-items: center; gap: 9px; }
  .legend i { width: 17px; height: 3px; border-radius: 2px; display: block; flex: none; }
  .legend i.up { background: var(--up); box-shadow: 0 0 9px rgba(255,138,61,0.65); }
  .legend i.down { background: var(--down); box-shadow: 0 0 9px rgba(56,189,248,0.6); }

  .bar {
    position: fixed; right: 32px; bottom: 32px;
    display: flex; align-items: center; gap: 10px;
  }
  .bar button {
    appearance: none; border: 1px solid rgba(140,175,220,0.26);
    background: rgba(18,30,46,0.55);
    color: var(--ink);
    font: inherit; font-size: 12.5px; letter-spacing: 0.4px;
    padding: 8px 16px; border-radius: 999px;
    cursor: pointer;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    transition: border-color .18s, background .18s, color .18s;
  }
  .bar button:hover { border-color: rgba(160,200,245,0.58); background: rgba(32,50,74,0.72); }
  .bar button.on { border-color: rgba(255,138,61,0.55); color: #ffb37a; }

  .hint {
    position: fixed; left: 50%; bottom: 36px; transform: translateX(-50%);
    font-size: 11.5px; color: rgba(125,139,160,0.62);
    letter-spacing: 0.5px; pointer-events: none; user-select: none;
    white-space: nowrap;
  }

  @media (max-width: 980px) {
    .hud { top: 16px; left: 18px; }
    .hud h1 { font-size: 15px; }
    .hud p { font-size: 10.5px; }
    .panel { top: auto; bottom: 74px; right: 14px; padding: 10px 11px; gap: 7px; }
    .panel .lab { width: 26px; font-size: 10px; }
    .seg button { padding: 4px 7px; font-size: 11px; }
    .nav .pos { min-width: 50px; font-size: 11px; }
    .panel .meta { font-size: 9.5px; padding-top: 5px; }
    .legend { left: 18px; bottom: 74px; font-size: 11px; }
    .bar { right: 18px; bottom: 18px; }
    .bar button { padding: 7px 13px; font-size: 12px; }
    .hint { display: none; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud">
  <h1>幻方穿线 · 上下交替半圆</h1>
  <p>1 → n² 数序连线<span class="sep">|</span>相邻两段交替从平面上下穿过</p>
</div>

<div class="panel">
  <div class="row">
    <span class="lab">阶数</span>
    <div class="seg" id="seg-order">
      <button data-v="3">3</button>
      <button data-v="4">4</button>
      <button data-v="5">5</button>
      <button data-v="6">6</button>
      <button data-v="7">7</button>
    </div>
  </div>
  <div class="row">
    <span class="lab">构型</span>
    <div class="nav" id="cfg-nav">
      <button id="cfg-prev" aria-label="上一个构型">‹</button>
      <span class="pos" id="cfg-pos">1 / 1</span>
      <button id="cfg-next" aria-label="下一个构型">›</button>
      <button id="cfg-rand" class="wide" aria-label="随机跳到某个构型">随机</button>
    </div>
  </div>
  <div class="row">
    <span class="lab">朝向</span>
    <div class="seg" id="seg-rot">
      <button data-v="0">0°</button>
      <button data-v="1">90°</button>
      <button data-v="2">180°</button>
      <button data-v="3">270°</button>
      <button data-v="m" class="alt">镜像</button>
    </div>
  </div>
  <div class="row">
    <span class="lab">弧高</span>
    <div class="seg" id="seg-arc">
      <button data-v="semi">半圆</button>
      <button data-v="flat">扁平</button>
    </div>
  </div>
  <div class="row">
    <span class="lab">1→2</span>
    <div class="seg" id="seg-phase">
      <button data-v="1">上</button>
      <button data-v="0">下</button>
    </div>
  </div>
  <div class="meta" id="meta"></div>
</div>

<div class="legend">
  <span><i class="up"></i>平面上方 · 拱桥</span>
  <span><i class="down"></i>平面下方 · 隧道</span>
</div>

<div class="hint">拖拽旋转 · 滚轮缩放 · 双击重播 · ←→ 换朝向</div>

<div class="bar">
  <button id="btn-replay">重播</button>
  <button id="btn-spin">自转</button>
</div>

  let order = 3;
  let cfg = 0;
  let rot = 0;
  let mir = false;
  let phaseUp = true;
  let arcMode = 'semi';
  let scene = buildScene(order, cfg, rot, mir);

  let SEG_DELAY = 0.26;
  let SEG_DUR = 0.50;

  let spin = false;
  let dragging = false;
  let startTime = performance.now();
  let elapsed = 0;

  function poolSize() { return buildMatrixPool(order).length; }

  function rebuild() {
    scene = buildScene(order, cfg, rot, mir);
    const cnt = scene.arcs.length;
    SEG_DELAY = clamp(0.045, 0.26, 4.5 / Math.max(1, cnt));
    SEG_DUR = clamp(0.30, 0.55, SEG_DELAY * 2.2);
    startTime = performance.now();
  }

  /* ============ 相机 ============ */
  const FOV = 46 * Math.PI / 180;
  const cam = { az: 0.38, el: 0.60, dist: 9.4 };
  let eye, fwd, rightV, upv, focal;

  function setupCamera() {
    const ce = Math.cos(cam.el), se = Math.sin(cam.el);
    eye = {
      x: cam.dist * ce * Math.sin(cam.az),
      y: cam.dist * se,
      z: cam.dist * ce * Math.cos(cam.az)
    };
    fwd = normalize({ x: -eye.x, y: -eye.y, z: -eye.z });
    rightV = normalize(cross(fwd, { x: 0, y: 1, z: 0 }));
    upv = cross(rightV, fwd);
    focal = (H * 0.5) / Math.tan(FOV * 0.5);
  }

  const _p3 = { x: 0, y: 0, z: 0 };
  const _p2 = { x: 0, y: 0, z: 0 };

  function proj(px, py, pz, out) {
    const dx = px - eye.x, dy = py - eye.y, dz = pz - eye.z;
    const vz = dx * fwd.x + dy * fwd.y + dz * fwd.z;
    const vx = dx * rightV.x + dy * rightV.y + dz * rightV.z;
    const vy = dx * upv.x + dy * upv.y + dz * upv.z;
    const s = focal / (vz > 0.05 ? vz : 0.05);
    out.x = W * 0.5 + vx * s;
    out.y = H * 0.5 - vy * s;
    out.z = vz;
    return out;
  }

  /* ============ 弧线 ============ */
  function arcPt(a, b, up, t, out) {
    const mx = (a.x + b.x) * 0.5, mz = (a.z + b.z) * 0.5;
    const hx = (b.x - a.x) * 0.5, hz = (b.z - a.z) * 0.5;
    const half = Math.sqrt(hx * hx + hz * hz);
    const ux = hx / half, uz = hz / half;
    const h = (arcMode === 'semi') ? half : (0.5 * scene.g);
    const th = Math.PI * t;
    const c = Math.cos(th), s = Math.sin(th);
    out.x = mx - half * c * ux;
    out.z = mz - half * c * uz;
    out.y = (up ? 1 : -1) * h * s;
    return out;
  }

  /* ============ 绘制：平面 ============ */
  function drawPlane() {
    const g = scene.g, n = scene.n;
    const corners = [
      [-HALF, -HALF], [HALF, -HALF], [HALF, HALF], [-HALF, HALF]
    ];

    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
      proj(corners[i][0], 0, corners[i][1], _p2);
      if (i === 0) ctx.moveTo(_p2.x, _p2.y);
      else ctx.lineTo(_p2.x, _p2.y);
    }
    ctx.closePath();
    ctx.fillStyle = 'rgba(78, 132, 196, 0.10)';
    ctx.fill();
    ctx.strokeStyle = 'rgba(138, 186, 244, 0.40)';
    ctx.lineWidth = 1.3;
    ctx.stroke();

    ctx.beginPath();
    for (let k = 1; k < n; k++) {
      const v = -HALF + k * g;
      proj(v, 0, -HALF, _p2); ctx.moveTo(_p2.x, _p2.y);
      proj(v, 0,  HALF, _p2); ctx.lineTo(_p2.x, _p2.y);
      proj(-HALF, 0, v, _p2); ctx.moveTo(_p2.x, _p2.y);
      proj( HALF, 0, v, _p2); ctx.lineTo(_p2.x, _p2.y);
    }
    ctx.strokeStyle = 'rgba(110, 165, 230, 0.16)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  /* ============ 绘制：弧线 ============ */
  function drawArcs(prog, wantUp) {
    const arcs = scene.arcs;
    const n = scene.n;
    const lw = n <= 4 ? 3.2 : (n <= 5 ? 2.6 : 2.1);
    const blur = n <= 4 ? 13 : (n <= 5 ? 9 : 5);

    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    for (let i = 0; i < arcs.length; i++) {
      const up = ((i % 2 === 0) === phaseUp);
      if (up !== wantUp) continue;

      const p = prog[i];
      if (p <= 0.001) continue;

      const arc = arcs[i];
      const hx = (arc.b.x - arc.a.x) * 0.5, hz = (arc.b.z - arc.a.z) * 0.5;
      const half = Math.sqrt(hx * hx + hz * hz);

      const density = clamp(14, 56, Math.ceil(18 + half * 34));
      const steps = Math.max(2, Math.ceil(density * p));

      ctx.beginPath();
      for (let k = 0; k <= steps; k++) {
        const t = (p * k) / steps;
        arcPt(arc.a, arc.b, up, t, _p3);
        proj(_p3.x, _p3.y, _p3.z, _p2);
        if (k === 0) ctx.moveTo(_p2.x, _p2.y);
        else ctx.lineTo(_p2.x, _p2.y);
      }

      ctx.strokeStyle = up ? '#ff8a3d' : '#3fbdf5';
      ctx.lineWidth = lw;
      ctx.shadowColor = up ? 'rgba(255, 138, 61, 0.60)' : 'rgba(63, 189, 245, 0.52)';
      ctx.shadowBlur = blur;
      ctx.stroke();
      ctx.shadowBlur = 0;
    }
  }

  /* ============ 绘制：格心光斑 + 数字 + 卦名 ============ */
  function nodeAlpha(v, t) {
    const appear = v <= 1 ? 0 : (v - 2) * SEG_DELAY + SEG_DUR * 0.60;
    return clamp((t - appear) / 0.24, 0, 1);
  }

  function drawNodes(t) {
    const n = scene.n;
    const r = clamp(8, 20, 20 * Math.sqrt(3 / n));

    for (let i = 0; i < scene.cells.length; i++) {
      const cell = scene.cells[i];
      const a = nodeAlpha(cell.n, t);
      if (a <= 0) continue;

      proj(cell.x, 0, cell.z, _p2);
      const gd = ctx.createRadialGradient(_p2.x, _p2.y, 0, _p2.x, _p2.y, r);
      gd.addColorStop(0, 'rgba(176, 212, 255, ' + (0.14 * a) + ')');
      gd.addColorStop(1, 'rgba(176, 212, 255, 0)');
      ctx.fillStyle = gd;
      ctx.beginPath();
      ctx.arc(_p2.x, _p2.y, r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawLabels(t) {
    const n = scene.n;
    const fs = clamp(9, 16, 16 * Math.sqrt(3 / n));
    const showGua = (n === 3);

    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';

    for (let i = 0; i < scene.cells.length; i++) {
      const cell = scene.cells[i];
      const a = nodeAlpha(cell.n, t);
      if (a <= 0) continue;

      proj(cell.x, 0, cell.z, _p2);
      const dy = showGua ? -Math.max(4, fs * 0.30) : 0;

      ctx.globalAlpha = a;
      ctx.font = '600 ' + fs + 'px ui-monospace, "SF Mono", Menlo, Consolas, monospace';
      ctx.strokeStyle = 'rgba(7, 10, 14, 0.92)';
      ctx.lineWidth = Math.max(3, fs * 0.28);
      ctx.strokeText(String(cell.n), _p2.x, _p2.y + dy);
      ctx.fillStyle = '#eaf2ff';
      ctx.fillText(String(cell.n), _p2.x, _p2.y + dy);

      if (showGua) {
        ctx.font = '400 11px "PingFang SC", "Microsoft YaHei", system-ui, sans-serif';
        ctx.strokeStyle = 'rgba(7, 10, 14, 0.85)';
        ctx.lineWidth = 3.2;
        ctx.strokeText(cell.gua, _p2.x, _p2.y + 11);
        ctx.fillStyle = 'rgba(160, 186, 214, 0.92)';
        ctx.fillText(cell.gua, _p2.x, _p2.y + 11);
      }

      ctx.globalAlpha = 1;
    }
  }

  /* ============ 主渲染 ============ */
  function render(t) {
    const bg = ctx.createRadialGradient(W * 0.5, H * 0.44, 0, W * 0.5, H * 0.44, Math.max(W, H) * 0.78);
    bg.addColorStop(0, '#111a26');
    bg.addColorStop(0.55, '#0a1018');
    bg.addColorStop(1, '#05080c');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    setupCamera();

    const cnt = scene.arcs.length;
    const prog = new Array(cnt);
    for (let i = 0; i < cnt; i++) {
      const raw = (t - i * SEG_DELAY) / SEG_DUR;
      prog[i] = raw <= 0 ? 0 : easeOut(clamp(raw, 0, 1));
    }

    if (eye.y >= 0) {
      drawArcs(prog, false);
      drawPlane();
      drawArcs(prog, true);
    } else {
      drawArcs(prog, true);
      drawPlane();
      drawArcs(prog, false);
    }

    drawNodes(t);
    drawLabels(t);
  }

  /* ============ 主循环 ============ */
  let lastT = 0;

  function loop(now) {
    if (!lastT) lastT = now;
    const dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    if (spin && !dragging) cam.az += 0.16 * dt;

    elapsed = (now - startTime) / 1000;
    render(elapsed);
    requestAnimationFrame(loop);
  }

  /* ============ 交互 ============ */
  const pointers = new Map();
  let lastX = 0, lastY = 0;
  let pinchPrev = 0;

  canvas.addEventListener('pointerdown', (e) => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}

    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      pinchPrev = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      dragging = false;
      canvas.classList.remove('grabbing');
    } else if (pointers.size === 1) {
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.classList.add('grabbing');
    }
  });

  canvas.addEventListener('pointermove', (e) => {
    if (!pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    if (pointers.size === 2) {
      const pts = [...pointers.values()];
      const d = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
      if (pinchPrev > 0 && d > 0) cam.dist = clamp(cam.dist * (pinchPrev / d), 5.5, 18);
      pinchPrev = d;
      return;
    }

    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX;
    lastY = e.clientY;

    cam.az -= dx * 0.0075;
    cam.el = clamp(cam.el + dy * 0.006, 0.12, 1.25);
  });

  function endPointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size < 2) pinchPrev = 0;
    if (pointers.size === 0) {
      dragging = false;
      canvas.classList.remove('grabbing');
    }
    try {
      if (canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
    } catch (err) {}
  }
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);

  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.dist = clamp(cam.dist * (1 + e.deltaY * 0.0011), 5.5, 18);
  }, { passive: false });

  function replay() { startTime = performance.now(); }
  canvas.addEventListener('dblclick', replay);

  /* ============ 面板 ============ */
  const INFO = {
    3: '本质解 <b>1</b> 类（洛书）· 含朝向共 <b>8</b> 种',
    4: '本质解 <b>880</b> 类（已全部收录）· 含朝向 <b>7040</b> 种',
    5: '本质解 <b>275,305,224</b> 类 · 此处 32 个拉丁方构型 + 1 个 Siamese',
    6: '本质解约 <b>1.775×10¹⁹</b> 类 · 6 阶无正交拉丁方对，只能用 LUX 解',
    7: '本质解数量<b>尚未知</b> · 此处 432 个拉丁方构型 + 1 个 Siamese'
  };

  function bindSeg(id, apply) {
    const el = document.getElementById(id);
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b || b.disabled) return;
      apply(b.dataset.v);
      syncUI();
      rebuild();
    });
  }

  function syncUI() {
    document.querySelectorAll('#seg-order button').forEach((b) => {
      b.classList.toggle('on', Number(b.dataset.v) === order);
    });

    document.querySelectorAll('#seg-rot button').forEach((b) => {
      const v = b.dataset.v;
      if (v === 'm') b.classList.toggle('on', mir);
      else b.classList.toggle('on', Number(v) === rot);
    });

    document.querySelectorAll('#seg-phase button').forEach((b) => {
      b.classList.toggle('on', (b.dataset.v === '1') === phaseUp);
    });
    document.querySelectorAll('#seg-arc button').forEach((b) => {
      b.classList.toggle('on', b.dataset.v === arcMode);
    });

    const ps = poolSize();
    document.getElementById('cfg-pos').textContent = (scene.ci + 1) + ' / ' + ps;
    document.getElementById('cfg-prev').disabled = (ps <= 1);
    document.getElementById('cfg-next').disabled = (ps <= 1);
    document.getElementById('cfg-rand').disabled = (ps <= 1);
    document.getElementById('cfg-nav').classList.toggle('off', ps <= 1);

    const sum = order * (order * order + 1) / 2;
    const hand = mir ? '反（镜像）' : '正';
    let extra = '';
    if (order === 3 && scene.oneP) {
      extra = '<br>1 位 <span class="hl">' + POS3[scene.oneP.r * 3 + scene.oneP.c] +
              '</span> · 5 恒在正中 · 手性 ' + hand;
    } else {
      extra = '<br>手性 ' + hand;
    }

    document.getElementById('meta').innerHTML =
      '<b>' + (order === 3 ? '后天八卦（洛书）' : order + ' 阶幻方') + '</b> · 幻和 ' + sum +
      '<br>' + INFO[order] +
      (ps > 1 ? '<br>构型 ' + (scene.ci + 1) + ' / ' + ps : '') + extra;
  }

  bindSeg('seg-order', (v) => { order = Number(v); cfg = 0; });
  bindSeg('seg-rot', (v) => {
    if (v === 'm') mir = !mir;
    else rot = Number(v);
  });
  bindSeg('seg-arc', (v) => { arcMode = v; });
  bindSeg('seg-phase', (v) => { phaseUp = (v === '1'); });

  document.getElementById('cfg-prev').addEventListener('click', () => {
    const ps = poolSize();
    if (ps <= 1) return;
    cfg = (cfg - 1 + ps) % ps;
    rebuild();
    syncUI();
  });
  document.getElementById('cfg-next').addEventListener('click', () => {
    const ps = poolSize();
    if (ps <= 1) return;
    cfg = (cfg + 1) % ps;
    rebuild();
    syncUI();
  });
  document.getElementById('cfg-rand').addEventListener('click', () => {
    const ps = poolSize();
    if (ps <= 1) return;
    let next = cfg;
    while (next === cfg) next = Math.floor(Math.random() * ps);
    cfg = next;
    rebuild();
    syncUI();
  });

  const btnReplay = document.getElementById('btn-replay');
  const btnSpin = document.getElementById('btn-spin');

  btnReplay.addEventListener('click', replay);
  btnSpin.addEventListener('click', () => {
    spin = !spin;
    btnSpin.classList.toggle('on', spin);
  });

  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space' || e.key === 'r' || e.key === 'R') {
      e.preventDefault();
      replay();
    } else if (e.key === 'ArrowLeft') {
      rot = (rot + 3) % 4;
      rebuild(); syncUI();
    } else if (e.key === 'ArrowRight') {
      rot = (rot + 1) % 4;
      rebuild(); syncUI();
    }
  });

  window.addEventListener('resize', resize);

  /* ============ 启动 ============ */
  resize();
  rebuild();
  syncUI();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
